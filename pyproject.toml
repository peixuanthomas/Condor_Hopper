[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "condor-hopper"
version = "0.2.0"
description = "20000 m vertical KSP hop and convex landing at a fixed site through kRPC"
requires-python = ">=3.11"
dependencies = ["krpc>=0.5.4", "numpy>=2.0", "cvxpy>=1.6", "clarabel>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
condor-hopper = "condor_hopper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["condor_hopper*"]
